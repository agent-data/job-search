# Routing discrimination across the seven skills: does a phrase reach the skill that owns it?
#
# Each phrase runs as its own `claude -p` session from a fresh workspace, and the session is
# killed the moment its first Skill call returns — the routing decision is made by then, and
# stopping there keeps a probe from turning into a live search. Driven by
# `evals/run_triggering.py`, not `run_eval.py`: one case here means many one-prompt sessions.
#
# The prompts are the trigger phrases as the skill descriptions and the restructure plan write
# them, used verbatim, so the measurement does not depend on how an implementer chose to phrase
# them. `setup-sentence` is the exception and the reason the set needs one: it is what
# `quickstart.yaml` sends, and a bare phrase does not predict a sentence built around it. On haiku
# `set up job search` reaches the front door in 9 reps of 9 while that sentence reaches it in 0 of
# 9, so both belong in the set.
#
# The last three are leakage probes on the two skills the promotion added, not front-door
# triggers. `what a call costs` is the phrase in `agent-data-reference`'s own description
# closest to something a user would say. `the agent-data CLI` tests name-adjacency: a separate
# marketplace skill is named `agent-data`, it says to use it when the user mentions agent-data,
# and both skills load in the same list. `what each workspace file holds` is the same test on
# `job-search-runbook` — its own most user-shaped phrase. Any of the three selecting a reference
# skill is leakage: neither reference skill claims a user phrase.
behaviors: [B16]
workspace: fresh
timeout_s: 120
models: [sonnet, haiku]
reps: 9
kill_after_event: "^Skill "
phrases:
  - id: setup
    prompt: set up job search
    expect: job-search:job-search
  - id: setup-sentence
    prompt: >-
      Set up my job search. I'm looking for a senior product-design role, remote in the US,
      at a mission-driven company.
    expect: job-search:job-search
  - id: schedule
    prompt: keep this running daily
    expect: job-search:job-search
  - id: status
    prompt: check my job search
    expect: job-search:job-search
  - id: run-now
    prompt: run a search now
    expect: job-search:job-search-run
  - id: why-failed
    prompt: why did my run fail
    expect: job-search:job-search-agent
  - id: cost-probe
    prompt: what a call costs
    expect: job-search:job-search-agent
    must_not_select: [job-search:agent-data-reference]
  - id: cli-probe
    prompt: the agent-data CLI
    expect: agent-data
    must_not_select: [job-search:agent-data-reference]
  - id: workspace-probe
    prompt: what each workspace file holds
    expect: job-search:job-search-agent
    must_not_select: [job-search:job-search-runbook]
