# One headless pass over a seeded workspace (evals/seeds/headless-run/ = AI-engineer
# preferences + 2-query config, created by the first task that runs this case).
# Also the benchmark case: B14 compares this run's wall-clock and metered calls
# against evals/baseline/2026-07-30-red-baseline.md.
#
# The seed's jobs.jsonl is empty, so the captured log holds one run's events and nothing else.
# B20 compares a per-run script against a whole-file one and needs that to stay true: seeding a
# judgment into evals/seeds/headless-run/jobs.jsonl would make the two read different postings.
behaviors: [B3, B4, B5, B6, B8, B14, B15, B17, B18, B20]
workspace: seeded
timeout_s: 1800
models: [sonnet, haiku]
prompt: >
  Run one job search pass now: find and judge new postings against my
  preferences and write a digest. Do not ask me questions; run headlessly.
