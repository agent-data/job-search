# Kill-injection case (evals/seeds/kill-midrun/ = same shape as the headless-run seed;
# created by the first task that runs this case). Session 1 starts a run; the runner
# terminates the child right after the first search-jobs Bash call completes
# (kill_after_event below — a regex matched against each tool call's name + JSON input),
# leaving an orphaned started-marker. Session 2 (followup_prompt, same workspace) must
# say the last run died, then rerun.
behaviors: [B9]
workspace: seeded
# Same allowance as headless-run: session 2 does not just report the marker, it runs a whole pass
# over the same seed, which took 981 s on sonnet. The first run of this case died at the old 900 s
# ceiling with 40 of its postings judged.
timeout_s: 1800
models: [sonnet, haiku]
kill_after_event: search-jobs
prompt: >
  Run one job search pass now: find and judge new postings against my
  preferences and write a digest. Do not ask me questions; run headlessly.
followup_prompt: >
  Run one job search pass now: find and judge new postings against my
  preferences and write a digest. Do not ask me questions; run headlessly.
