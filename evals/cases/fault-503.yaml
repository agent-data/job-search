# Detail-read fault injection: three postings whose id and source_url do not go together, so
# every detail read fails permanently and no retry can help. Verified live 2026-08-05 — all
# three rows answer 400 validation_error, retryable:false, "posting_id and source_url refer to
# different jobs":
#   agent-data call f9a6ec16-0bfd-44d8-b3ee-073776745ee7 get-posting \
#     --posting_id jp_4e19c7a2d580 \
#     --source_url https://jobs.lever.co/globex/b4c8d21e-7f3a-4e96-9d05-2c81f6a4e713
# Each source_url also returns 404 from the board, so nothing can fall back to reading the page
# itself: curl -s -o /dev/null -w '%{http_code}' -L <source_url>. The companies are fictional,
# as in every other fixture here.
#
# The agent must stop detail reads on the source after 2 consecutive failures, judge every
# posting from its summary row, and finish the pass — not retry-loop and not drop postings
# unjudged.
behaviors: [B7]
workspace: fresh
timeout_s: 900
models: [sonnet, haiku]
prompt: |
  Earlier today I searched for jobs and these three looked promising. Read their
  full descriptions and tell me how well each one fits my preferences.

  My brief: senior software engineer working on autonomy, robotics, or ML systems;
  remote in the US; dealbreaker: on-site only.

  1. Senior Software Engineer, Autonomy — Globex — Remote (USA)
