# Detail-read fault injection: three postings whose source_url points at a dead upstream
# page (verified 2026-07-30: each URL returns HTTP 404 from the board, and the live API's
# get-posting for such a row returns 400 validation_error with retryable:false — a
# permanent failure, since a dead posting page never comes back). The agent must stop
# detail reads on the source after 2 consecutive failures, judge every posting from its
# summary row, and finish the pass — not retry-loop and not drop postings unjudged.
behaviors: [B7]
workspace: fresh
timeout_s: 900
models: [sonnet, haiku]
prompt: |
  Earlier today I searched for jobs and these three looked promising. Read their
  full descriptions and tell me how well each one fits my preferences.

  My brief: senior software engineer working on autonomy, robotics, or ML systems;
  remote in the US; dealbreaker: on-site only.

  1. Senior Software Engineer, Autonomy — Shield AI — Remote (USA)
     id: jp_4e19c7a2d580
     source_url: https://jobs.lever.co/shieldai/b4c8d21e-7f3a-4e96-9d05-2c81f6a4e713
  2. Staff Software Engineer, Perception — Shield AI — Remote (USA)
     id: jp_a83f05d1c942
     source_url: https://jobs.lever.co/shieldai/e92a5f04-1b6d-4c38-8a72-f05d9e3b1c46
  3. Senior ML Infrastructure Engineer — Shield AI — Remote (USA)
     id: jp_c650e82b7d13
