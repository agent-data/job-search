# Post-first-run session (evals/seeds/schedule/ = a workspace with preferences, config,
# jobs.jsonl, and one completed run record; created by the first task that runs this case).
# The agent must configure the recurring job AND verify it by running the canary through
# the real scheduled path — a run record with trigger: scheduled and a healthy close.
# Running this case installs a real scheduler entry (cron/launchd/host-native) on the machine, and
# a launchd job outlives the session: launchd starts it outside the child's process group, so the
# SIGKILL that ends the session never reaches it. On 2026-08-07 one fired after the harness had
# moved the owner's real ~/.job-search back and wrote into it. This comment used to end "remove it
# after grading", and nothing removed the entry on the day that instruction was missed.
# `evals/run_eval.py` now lists the machine's scheduler entries before and after the session and
# reports the run FAILED while a new one is still installed, naming each one. Remove what it names
# the way it was installed, then rerun.
behaviors: [B11]
workspace: seeded
timeout_s: 1500
models: [sonnet, haiku]
prompt: >
  Keep this running daily.
