# Single-posting fit judgment, brief inline. The runner replaces {live_posting} with a
# posting fetched from the live API at run time (one search-jobs + one get-posting call;
# see fetch_live_posting in evals/run_eval.py), so the judged posting is always current
# and the search step never contaminates the fit grade.
behaviors: [B12]
workspace: fresh
timeout_s: 600
models: [sonnet, haiku]
prompt: |
  Here is a job posting I found:

  {live_posting}

  Does this posting fit my preferences? My brief: AI/ML engineer roles,
  remote in the US or EU, mid-to-senior, at product companies;
  dealbreakers: on-site only, crypto.
