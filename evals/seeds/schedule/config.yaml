version: 2
workspace:
  preferences_path: "preferences.md"
  master_resume_path: "resumes/master.md"
queries:
  - { id: "ai-ml-eng-remote", keywords: "AI ML engineer remote", location: "United States", limit: 25, enabled: true }
  - { id: "llm-eng-remote",   keywords: "LLM engineer remote",   location: "United States", limit: 25, enabled: true }
search:
  sources: ["linkedin", "ashby"]   # job sources each query runs against: linkedin | ashby | greenhouse | lever
  freshness: "past-2-weeks"    # any | past-week | past-2-weeks | past-month — recency window (applied server-side)
schedule:
  frequency: "daily"
  time: "08:00"
  consented: null              # the date the user agreed to a recurring search, as YYYY-MM-DD
notify:
  digest_path_template: "reports/{date}-digest.md"
  desktop_notify_on_block: true
