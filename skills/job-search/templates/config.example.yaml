version: 2
workspace:
  preferences_path: "preferences.md"
  master_resume_path: "resumes/master.md"
queries:
  - { id: "ai-eng-remote",  keywords: "AI engineer",          location: "United States",         limit: 10, enabled: true }
  - { id: "ml-platform-sf", keywords: "ML platform engineer", location: "San Francisco Bay Area", limit: 10, enabled: true }
search:
  sources: ["linkedin"]   # job sources each query runs against: linkedin | ashby | greenhouse | lever — add "ashby", "greenhouse" or "lever" to search company boards too
  freshness: "past-2-weeks"    # any | past-week | past-2-weeks | past-month — recency window (applied server-side)
  # max_new_postings_per_run: 50  # optional: positive integer or "all"; omit for first-page coverage
  # parallel_detail_reads: true # optional; set after approval to use parallel subagents where supported
schedule:
  frequency: "daily"           # hourly | every-2-hours | every-6-hours | daily | weekly — how often the search runs; the advocated default is an unattended wall-clock schedule (cron/launchd where the machine has one), with an in-session loop as the fallback
  time: "08:00"                # HH:MM — honored by wall-clock schedulers (cron/launchd); an interval-only in-session loop ignores it and just repeats on the interval
  timezone: "America/Los_Angeles"  # IANA zone name — setup writes the system timezone; change it only to schedule in a different zone
  consented: null              # the date the user agreed to a recurring search, as YYYY-MM-DD; a scheduled, headless, or subagent run proceeds on it
notify:
  digest_path_template: "reports/{date}-digest.md"
  desktop_notify_on_block: true
